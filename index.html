<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>BreadTalk Speaking Project Vol2 · Extra practice</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2430; --muted: #6b7280; --line: #e4e0d6;
    --accent: #2f5d50; --accent-soft: #e3efe9;
    --good: #1d7a46; --good-bg: #e2f4e8; --bad: #b3261e; --bad-bg: #fbe6e4;
    --chip: #fff6dc; --chip-line: #e8d79b; --tabs-h: 58px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --card: #20242c; --ink: #eceae4; --muted: #9aa1ad; --line: #343a45;
      --accent: #7fc4ac; --accent-soft: #263a33;
      --good: #6fd09a; --good-bg: #1d3a2a; --bad: #ff9a92; --bad-bg: #432421;
      --chip: #3a3422; --chip-line: #6b5d2c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  /* ---------- site shell ---------- */
  .site-head { max-width: 860px; margin: 0 auto; padding: 26px 16px 8px; }
  .site-head .brand { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .site-head h1 { margin: 2px 0 0; font-size: 2rem; letter-spacing: -0.02em; }
  .site-head p { margin: 4px 0 0; color: var(--muted); }
  .ltabs { max-width: 860px; margin: 0 auto; padding: 12px 16px 6px; display: flex; flex-wrap: wrap; gap: 8px; }
  .ltab {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 9px 15px; border-radius: 12px; font: inherit; font-size: .95rem; cursor: pointer;
  }
  .ltab[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .ltab[aria-selected="true"] { color: #10261e; } }
  main { max-width: 860px; margin: 0 auto; padding: 8px 16px 70px; }
  .lpanel { display: none; }
  .lpanel.active { display: block; }
  .lesson-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0 10px; }
  .lesson-top h2 { margin: 0; font-size: 1.25rem; }

  .gate { max-width: 460px; margin: 18px auto; text-align: center; padding: 22px 18px; }
  .gate h2 { margin: 0 0 6px; font-size: 1.2rem; }
  .gate .intro { margin-bottom: 14px; }
  .gate-form { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .gate-form input[type="password"], .gate-form input[type="text"], .field input {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .gate-form label.show { font-size: .88rem; color: var(--muted); text-align: left; display: flex; gap: 8px; align-items: center; }
  .err { color: var(--bad); min-height: 1.4em; font-size: .93rem; }
  .soon { text-align: center; padding: 28px 16px; }
  .soon .big { font-size: 2.2rem; }

  /* ---------- exercise chrome ---------- */
  .subnav { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); height: var(--tabs-h); }
  .tabs { max-width: 860px; margin: 0 auto; padding: 8px 0; display: flex; gap: 8px; overflow-x: auto; height: 100%; align-items: center; -webkit-overflow-scrolling: touch; }
  .tab {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 8px 14px; border-radius: 999px; font: inherit; font-size: .92rem; cursor: pointer; white-space: nowrap;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (prefers-color-scheme: dark) { .tab[aria-selected="true"] { color: #10261e; } }
  .lesson-body { padding-top: 16px; }
  .ex { display: none; scroll-margin-top: calc(var(--tabs-h) + 8px); }
  .ex.active { display: block; }
  .intro { color: var(--muted); margin: 0 0 16px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .card.correct { border-color: var(--good); background: var(--good-bg); }
  .card.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .num { color: var(--muted); font-size: .85rem; margin-bottom: 4px; }

  button.primary, button.ghost { font: inherit; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  @media (prefers-color-scheme: dark) { button.primary { color: #10261e; } }
  button.primary[disabled] { opacity: .6; cursor: default; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.small { padding: 6px 12px; font-size: .85rem; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .score { font-weight: 600; }

  .tf-btns { display: flex; gap: 8px; margin-top: 10px; }
  .tf-btns button { flex: 0 0 auto; min-width: 90px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 16px; border-radius: 10px; font: inherit; cursor: pointer; }
  .tf-btns button.sel { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
  .why { display: none; margin-top: 10px; font-size: .95rem; }
  .why.show { display: block; }
  .why b { display: inline-block; margin-right: 4px; }

  .def-text { font-size: 1.02rem; }
  select { width: 100%; margin-top: 10px; padding: 10px 12px; font: inherit; font-size: 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .note { margin-top: 8px; font-size: .93rem; }

  .bank { position: sticky; top: calc(var(--tabs-h) + 6px); z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 14px; max-height: 34vh; overflow-y: auto; box-shadow: 0 6px 14px rgba(0,0,0,.08); }
  .bank-title { font-size: .8rem; color: var(--muted); margin: 0 4px 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--chip-line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: .92rem; cursor: pointer; }
  .chip.used { opacity: .35; text-decoration: line-through; cursor: default; }
  .chip.picked { outline: 2px solid var(--accent); background: var(--accent-soft); }
  .gap-text { font-size: 1.02rem; }
  .gap { display: inline-block; min-width: 130px; padding: 1px 10px; margin: 0 2px; border: 2px dashed var(--chip-line); border-radius: 8px; text-align: center; background: var(--chip); cursor: pointer; vertical-align: baseline; }
  .gap.filled { border-style: solid; font-weight: 600; }
  .gap.ok { border-color: var(--good); background: var(--good-bg); color: var(--good); }
  .gap.no { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }

  .answer-area { min-height: 48px; padding: 8px; margin: 8px 0; border: 2px dashed var(--line); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .answer-area .dot { margin-left: 2px; font-size: 1.05rem; }
  .pool { display: flex; flex-wrap: wrap; gap: 6px; }
  .word { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 5px 11px; font: inherit; cursor: grab; text-align: left; touch-action: none; user-select: none; -webkit-user-select: none; }
  .answer-area .word { background: var(--accent-soft); border-color: var(--accent); }
  .locked .word, .locked .chip, .locked .gap, .locked .tf-btns button, .locked select { pointer-events: none; }
  .word.drag-src { opacity: .3; }
  .word.ghost { position: fixed; z-index: 1000; pointer-events: none; margin: 0; box-shadow: 0 8px 18px rgba(0,0,0,.25); transform: rotate(-2deg); cursor: grabbing; }
  .drop-hover { border-color: var(--accent) !important; background: var(--accent-soft); }

  .rounds { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .pill { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; border-radius: 999px; font: inherit; font-size: .88rem; cursor: pointer; }
  .pill[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (prefers-color-scheme: dark) { .pill[aria-selected="true"] { color: #10261e; } }
  .pill.ghostpill { border-style: dashed; color: var(--muted); }

  /* ---------- results tab ---------- */
  .sumrow { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .sumrow:last-child { border-bottom: 0; }
  .sumrow .l { font-weight: 600; }
  .sumrow .r { color: var(--muted); text-align: right; }
  .sumtotal { font-size: 1.15rem; font-weight: 700; margin-top: 4px; }
  .field { margin: 14px 0 4px; }
  .field label { display: block; font-size: .88rem; color: var(--muted); margin-bottom: 4px; }
  .savebtns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .hint { color: var(--muted); font-size: .88rem; margin-top: 10px; }
  .status { margin-top: 10px; font-weight: 600; min-height: 1.4em; }

  /* ---------- phones / touch ---------- */
  @media (max-width: 520px) {
    .site-head h1 { font-size: 1.6rem; }
    .lesson-top h2 { font-size: 1.05rem; }
    .gap { min-width: 100px; }
  }
  @media (pointer: coarse) {
    .chip { padding: 8px 12px; }
    .word { padding: 9px 13px; }
    .pill { padding: 9px 14px; }
    .tf-btns button { padding: 11px 18px; }
    button.primary, button.ghost { padding: 12px 18px; }
    button.small { padding: 8px 13px; }
  }

  /* ---------- printing the report to PDF ---------- */
  #print-root { display: none; }
  @page { margin: 12mm; }
  @media print {
    body.printing > *:not(#print-root) { display: none !important; }
    body.printing #print-root { display: block; }
    body.printing { background: #fff; }
  }
</style>

/* ============================ crypto ============================ */
const normPw = function (s) { return String(s).trim().toLowerCase(); };
function unb64(s) {
  const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function decryptLesson(L, pw) {
  if (!(window.crypto && window.crypto.subtle)) { const e = new Error('nocrypto'); e.code = 'nocrypto'; throw e; }
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normPw(pw)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: unb64(L.salt), iterations: L.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(L.iv) }, key, unb64(L.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function whenString() {
  const d = new Date();
  try { return d.toLocaleString('en-GB', { dateStyle: 'long', timeStyle: 'short' }); }
  catch (e) { return d.toLocaleString(); }
}
function fileBase(L, name) {
  let n = String(name || '').trim();
  try { n = n.replace(new RegExp('[^\\p{L}\\p{N}]+', 'gu'), '_'); } catch (e) { n = n.replace(/[^\w]+/g, '_'); }
  n = n.replace(/^_+|_+$/g, '');
  const t = L.title.replace(/^Lesson \d+\s*·\s*/, '').replace(/[^\w]+/g, '');
  const d = new Date(), p = function (x) { return String(x).padStart(2, '0'); };
  return t + '_results' + (n ? '_' + n : '') + '_' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function sentenceWith(d, text) {
  if (d.q.indexOf('___') === -1) return null;
  const parts = d.q.split('___');
  return esc(parts[0]) + text + esc(parts.slice(1).join('___'));
}
function itemHTML(d, idx) {
  const cls = d.ok ? 'ok' : 'no';
  const given = d.given ? esc(d.given) : '—';
  const withGap = sentenceWith(d, '<mark class="' + cls + '">' + given + '</mark>');
  let h = '<div class="card ' + cls + '"><div class="num">' + (idx + 1) + '</div><div class="q">' + (withGap || esc(d.q)) + '</div>';
  h += '<div class="ans">' + (d.ok ? '✅' : '❌') + ' Your answer: <b>' + given + '</b></div>';
  if (!d.ok) h += '<div class="fix">Correct answer: ' + esc(d.correct) + '</div>';
  if (d.why) h += '<div class="why">' + esc(d.why) + '</div>';

}
function mistakeLine(m) {
  const d = m.d, given = d.given ? esc(d.given) : '—';
  const withGap = sentenceWith(d, '<span class="you">[' + given + ']</span>');
  let h = '<li>' + (withGap || esc(d.q));

  h += '<span class="tag ' + (m.fixed ? 'fixed' : 'still') + '">' + (m.fixed ? 'fixed on retry' : 'still wrong') + '</span></li>';

function reportBody(L, name, snaps) {
  let N = 0, T = 0;
  snaps.forEach(function (s) { N += s.n; T += s.total; });
  const h = [];
  h.push('<div class="wrap"><h1>' + esc(L.title) + '</h1>');
  h.push('<div class="meta">My results' + (name ? ' · <b>' + esc(name) + '</b>' : '') + ' · ' + esc(whenString()) + '</div>');
  h.push('<div class="sumbox">');
  snaps.forEach(function (s) {
    const prog = s.checked === 0 ? 'not done yet' : (s.n + ' / ' + s.total + (s.rounds > 1 ? ' · ' + s.checked + ' of ' + s.rounds + ' rounds' : ''));
    h.push('<div class="sumrow"><span><b>' + esc(s.label) + '</b></span><span class="r">' + prog + '</span></div>');
  });
  h.push('</div><div class="total">Total: ' + N + ' / ' + T + (T && N === T ? ' 🎉' : '') + '</div>');
  const any = snaps.some(function (s) { return s.log.length; });
  if (any) {
    h.push('<h2>Mistakes to review</h2><p class="sub">Every wrong answer from your checks, including ones you fixed on a retry.</p>');
    snaps.forEach(function (s) {
      if (!s.log.length) return;

      s.log.forEach(function (m) { h.push(mistakeLine(m)); });

  snaps.forEach(function (s) {
    if (!s.details.length) return;
    h.push('<h2>' + esc(s.label) + ' · ' + s.n + ' / ' + s.total + '</h2>');
    if (s.rounds > 1 && s.checked < s.rounds) h.push('<p class="sub">' + s.checked + ' of ' + s.rounds + ' rounds checked, only those are shown.</p>');
    s.details.forEach(function (d, i) { h.push(itemHTML(d, i)); });
  });
  h.push('<div class="foot">Saved from the ' + esc(SITE_TITLE) + ' practice page.</div></div>');
  return h.join('');
}

function downloadFile(filename, text, type) {
  const blob = new Blob([text], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 10000);
}

function printReport(L, name, snaps) {

}

  document.body.classList.remove('printing');

/* ============================ mistake log ============================ */
function MistakeLog() {
  const seen = {}, list = [], lastOk = {};
  return {
    record: function (details) {
      details.forEach(function (d) {
        lastOk[d.key] = d.ok;
        if (!d.ok) {
          const k = d.key + '|' + d.given;
          if (!seen[k]) { seen[k] = true; list.push(d); }
        }
      });
    },
    all: function () { return list.map(function (d) { return { d: d, fixed: lastOk[d.key] === true }; }); }
  };
}

/* ---------- 1. True / False ---------- */
function TFTab(ui, items, log) {
  let state = {}, locked = false, result = null, cards = [], whys = [];
  function render() {
    state = {}; locked = false; result = null; cards = []; whys = [];
    ui.list.innerHTML = ''; ui.score.textContent = '';
    items.forEach(function (q, i) {
      const card = el('div', 'card');
      card.appendChild(el('div', 'num', 'Statement ' + (i + 1) + ' of ' + items.length));
      card.appendChild(el('div', '', q.s));
      const btns = el('div', 'tf-btns');
      [['True', true], ['False', false]].forEach(function (pair) {
        const b = el('button', '', pair[0]); b.type = 'button';
        b.addEventListener('click', function () {
          if (locked) return;
          state[i] = pair[1];
          btns.querySelectorAll('button').forEach(function (x) { x.classList.remove('sel'); });
          b.classList.add('sel');
        });
        btns.appendChild(b);
      });
      card.appendChild(btns);
      const why = el('div', 'why'); card.appendChild(why);
      ui.list.appendChild(card); cards.push(card); whys.push(why);
    });
  }
  ui.check.addEventListener('click', function () {
    locked = true;
    let n = 0; const details = [];
    items.forEach(function (q, i) {
      const ok = state[i] === q.a;
      if (ok) n++;
      cards[i].classList.remove('correct', 'wrong');
      cards[i].classList.add(ok ? 'correct' : 'wrong', 'locked');
      whys[i].innerHTML = '';
      whys[i].appendChild(el('b', '', ok ? '✅ Correct. ' : '❌ ' + (state[i] === undefined ? 'No answer. ' : '') + 'The answer is ' + (q.a ? 'True' : 'False') + '. '));
      whys[i].appendChild(document.createTextNode(q.why));
      whys[i].classList.add('show');
      details.push({ key: q.s, q: q.s, given: state[i] === undefined ? '' : (state[i] ? 'True' : 'False'), correct: q.a ? 'True' : 'False', ok: ok, why: q.why });
    });
    result = { n: n, total: items.length, details: details };
    log.record(details);
    ui.score.textContent = 'Score: ' + n + ' / ' + items.length + (n === items.length ? ' 🎉' : '');
  });
  ui.reset.addEventListener('click', render);
  render();
  return {
    snapshot: function () {
      return { rounds: 1, checked: result ? 1 : 0, n: result ? result.n : 0, total: result ? result.total : 0,
               itemsAll: items.length, details: result ? result.details : [], log: log.all() };
    }
  };
}

/* ---------- rounds engine (tabs 2-4) ---------- */
function RoundTab(ui, data, size, build, log) {
  let rounds = [], results = [], views = [], cur = 0;
  function init() {
    rounds = chunk(shuffle(data), size);
    results = rounds.map(function () { return null; });
    views = rounds.map(function () { return null; });
    show(0, true);
  }
  function show(i, keepScroll) {
    cur = i;
    if (!views[i]) views[i] = build(rounds[i]);
    ui.list.innerHTML = '';
    ui.list.appendChild(views[i].el);
    draw();
    if (!keepScroll) ui.sec.scrollIntoView();
  }
  function draw() {
    ui.pills.innerHTML = '';
    rounds.forEach(function (r, i) {
      const b = el('button', 'pill', 'Round ' + (i + 1) + (results[i] ? ' · ' + results[i].n + '/' + results[i].total : ''));
      b.type = 'button';
      b.setAttribute('aria-selected', i === cur ? 'true' : 'false');
      b.addEventListener('click', function () { show(i); });
      ui.pills.appendChild(b);
    });
    const re = el('button', 'pill ghostpill', '↺ New order'); re.type = 'button';
    re.title = 'Shuffle everything and start from Round 1';
    re.addEventListener('click', function () {
      if (results.some(Boolean) && !window.confirm('This reshuffles everything and clears the rounds you have already checked. Continue?')) return;
      init();
    });
    ui.pills.appendChild(re);
    let txt = '';
    if (results[cur]) txt = 'Round ' + (cur + 1) + ': ' + results[cur].n + ' / ' + results[cur].total;
    const done = results.filter(Boolean);
    if (done.length) {
      const N = done.reduce(function (a, r) { return a + r.n; }, 0);
      const T = done.reduce(function (a, r) { return a + r.total; }, 0);
      const all = done.length === rounds.length;
      txt += (txt ? ' · ' : '') + (all ? 'Total: ' : 'So far: ') + N + ' / ' + T + (all && N === T ? ' 🎉' : '');
    }
    ui.score.textContent = txt;
    ui.next.style.display = cur < rounds.length - 1 ? '' : 'none';
  }
  ui.check.addEventListener('click', function () {
    if (results[cur]) return;
    results[cur] = views[cur].check();
    log.record(results[cur].details);
    draw();
  });
  ui.reset.addEventListener('click', function () { views[cur] = null; results[cur] = null; show(cur, true); });
  ui.next.addEventListener('click', function () { if (cur < rounds.length - 1) show(cur + 1); });
  init();
  return {
    snapshot: function () {
      const done = results.filter(Boolean);
      let details = [];
      done.forEach(function (r) { details = details.concat(r.details); });
      return { rounds: rounds.length, checked: done.length,
               n: done.reduce(function (a, r) { return a + r.n; }, 0),
               total: done.reduce(function (a, r) { return a + r.total; }, 0),
               itemsAll: data.length, details: details, log: log.all() };
    }
  };
}

function buildDef(items) {
  const wrap = el('div');
  const rows = items.map(function (q, i) {
    const card = el('div', 'card');
    card.appendChild(el('div', 'num', 'Definition ' + (i + 1) + ' of ' + items.length));
    card.appendChild(el('div', 'def-text', q.d));
    const sel = el('select');
    const ph = el('option', '', 'Choose the word or phrase…'); ph.value = ''; sel.appendChild(ph);
    shuffle([q.a].concat(q.x)).forEach(function (opt) { const o = el('option', '', opt); o.value = opt; sel.appendChild(o); });
    card.appendChild(sel);
    const note = el('div', 'note'); card.appendChild(note);
    wrap.appendChild(card);
    return { q: q, card: card, sel: sel, note: note };
  });
  return {
    el: wrap,
    check: function () {
      let n = 0; const details = [];
      rows.forEach(function (r) {
        const ok = r.sel.value === r.q.a;
        if (ok) n++;
        r.card.classList.add(ok ? 'correct' : 'wrong', 'locked');
        r.note.textContent = ok ? '✅ Correct!' : '❌ The answer is: ' + r.q.a;
        details.push({ key: r.q.d, q: r.q.d, given: r.sel.value, correct: r.q.a, ok: ok });
      });
      return { n: n, total: rows.length, details: details };
    }
  };
}

function buildGap(items) {
  const wrap = el('div');
  const bankBox = el('div', 'bank');
  bankBox.appendChild(el('div', 'bank-title', 'Word bank'));
  const chipsEl = el('div', 'chips'); bankBox.appendChild(chipsEl);
  wrap.appendChild(bankBox);
  const bank = shuffle(items.map(function (g) { return g.a; })).map(function (t) { return { text: t, used: false }; });
  const placed = items.map(function () { return null; });
  let picked = null, locked = false;
  const slots = [], cards = [], notes = [];
  items.forEach(function (g, i) {
    const card = el('div', 'card');
    card.appendChild(el('div', 'num', 'Sentence ' + (i + 1) + ' of ' + items.length));
    const p = el('div', 'gap-text');
    const parts = g.t.split('___');
    p.appendChild(document.createTextNode(parts[0]));
    const slot = el('span', 'gap', ' ');
    slot.addEventListener('click', function () { onSlot(i); });
    p.appendChild(slot);
    p.appendChild(document.createTextNode(parts[1]));
    card.appendChild(p);
    const note = el('div', 'note'); card.appendChild(note);
    wrap.appendChild(card);
    slots.push(slot); cards.push(card); notes.push(note);
  });
  function draw() {
    chipsEl.innerHTML = '';
    bank.forEach(function (c, idx) {
      const b = el('button', 'chip' + (c.used ? ' used' : '') + (picked === idx ? ' picked' : ''), c.text);
      b.type = 'button';
      b.addEventListener('click', function () {
        if (locked || c.used) return;
        picked = (picked === idx) ? null : idx;
        draw();
      });
      chipsEl.appendChild(b);
    });
    slots.forEach(function (slot, i) {
      const bi = placed[i];
      slot.textContent = bi === null ? ' ' : bank[bi].text;
      slot.classList.toggle('filled', bi !== null);
    });
  }
  function onSlot(i) {
    if (locked) return;
    const current = placed[i];
    if (picked === null) {
      if (current !== null) { bank[current].used = false; placed[i] = null; draw(); }
      return;
    }
    if (current !== null) bank[current].used = false;
    placed[i] = picked; bank[picked].used = true; picked = null;
    draw();
  }
  draw();
  return {
    el: wrap,
    check: function () {
      locked = true; picked = null;
      let n = 0; const details = [];
      items.forEach(function (g, i) {
        const bi = placed[i];
        const ok = bi !== null && bank[bi].text === g.a;
        if (ok) n++;
        slots[i].classList.remove('ok', 'no'); slots[i].classList.add(ok ? 'ok' : 'no');
        notes[i].textContent = ok ? '' : '❌ The answer is: ' + g.a;
        cards[i].classList.add('locked');
        details.push({ key: g.t, q: g.t, given: bi === null ? '' : bank[bi].text, correct: g.a, ok: ok });
      });
      bankBox.classList.add('locked');
      draw();
      return { n: n, total: items.length, details: details };
    }
  };
}

function buildScr(items) {
  const wrap = el('div');
  let locked = false, suppressClick = false;
  const parts = items.map(function (q, qi) {
    const words = tokensOf(q.s);
    let pool = words.map(function (w, k) { return { id: k, w: w }; });
    let tries = 0;
    do { pool = shuffle(pool); tries++; }
    while (tries < 20 && pool.map(function (p) { return p.w; }).join(' ') === words.join(' '));
    const card = el('div', 'card');
    card.appendChild(el('div', 'num', 'Sentence ' + (qi + 1) + ' of ' + items.length));
    const ansEl = el('div', 'answer-area'), poolEl = el('div', 'pool'), note = el('div', 'note');
    card.appendChild(ansEl); card.appendChild(poolEl); card.appendChild(note);
    wrap.appendChild(card);
    return { q: q, pool: pool, initial: pool.map(function (p) { return p.w; }), ans: [], card: card, ansEl: ansEl, poolEl: poolEl, note: note };
  });
  function draw(qi) {
    const p = parts[qi];
    p.ansEl.innerHTML = ''; p.poolEl.innerHTML = '';
    p.ans.forEach(function (item) { p.ansEl.appendChild(makeWord(qi, item, 'ans')); });
    const endMark = p.q.s.slice(-1);
    if (/[.!?]/.test(endMark)) p.ansEl.appendChild(el('span', 'dot', endMark));
    p.pool.forEach(function (item) { p.poolEl.appendChild(makeWord(qi, item, 'pool')); });
  }
  function moveWord(qi, item, from, to, idx) {
    const p = parts[qi], src = p[from];
    src.splice(src.indexOf(item), 1);
    const dst = p[to];
    if (idx === null || idx === undefined || idx >= dst.length) dst.push(item); else dst.splice(idx, 0, item);
    draw(qi);
  }
  function makeWord(qi, item, from) {
    const b = el('button', 'word', item.w); b.type = 'button';
    b.addEventListener('click', function () {
      if (suppressClick || locked) return;
      moveWord(qi, item, from, from === 'pool' ? 'ans' : 'pool', null);
    });
    b.addEventListener('pointerdown', function (e) { startDrag(e, qi, item, from, b); });
    return b;
  }
  function zoneAt(qi, x, y) {
    const t = document.elementFromPoint(x, y);
    if (!t) return null;
    const p = parts[qi];
    if (p.ansEl.contains(t)) return 'ans';
    if (p.poolEl.contains(t)) return 'pool';
    if (p.card.contains(t)) return y <= p.ansEl.getBoundingClientRect().bottom ? 'ans' : 'pool';
    return null;
  }
  function insertIndex(qi, x, y) {
    let idx = 0;
    parts[qi].ansEl.querySelectorAll('.word:not(.drag-src)').forEach(function (w) {
      const r = w.getBoundingClientRect();
      if (y > r.bottom || (y >= r.top && x > r.left + r.width / 2)) idx++;
    });
    return idx;
  }
  function startDrag(e, qi, item, from, srcEl) {
    if (locked) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const startX = e.clientX, startY = e.clientY;
    const rect = srcEl.getBoundingClientRect();
    const offX = startX - rect.left, offY = startY - rect.top;
    let dragging = false, ghost = null;
    try { srcEl.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }
    function clearHover() { parts[qi].ansEl.classList.remove('drop-hover'); parts[qi].poolEl.classList.remove('drop-hover'); }
    function onMove(ev) {
      if (!dragging) {
        if (Math.hypot(ev.clientX - startX, ev.clientY - startY) < 6) return;
        dragging = true;
        ghost = srcEl.cloneNode(true);
        ghost.classList.add('ghost');
        ghost.style.width = rect.width + 'px';
        document.body.appendChild(ghost);
        srcEl.classList.add('drag-src');
      }
      ghost.style.left = (ev.clientX - offX) + 'px';
      ghost.style.top = (ev.clientY - offY) + 'px';
      clearHover();
      const z = zoneAt(qi, ev.clientX, ev.clientY);
      if (z) parts[qi][z === 'ans' ? 'ansEl' : 'poolEl'].classList.add('drop-hover');
    }
    function onUp(ev) {
      srcEl.removeEventListener('pointermove', onMove);
      srcEl.removeEventListener('pointerup', onUp);
      srcEl.removeEventListener('pointercancel', onUp);
      try { srcEl.releasePointerCapture(e.pointerId); } catch (err) { /* not critical */ }
      if (!dragging) return;
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 0);
      clearHover();
      ghost.remove();
      const z = ev.type === 'pointercancel' ? null : zoneAt(qi, ev.clientX, ev.clientY);
      if (z === 'ans') moveWord(qi, item, from, 'ans', insertIndex(qi, ev.clientX, ev.clientY));
      else if (z === 'pool') moveWord(qi, item, from, 'pool', null);
      else draw(qi);
    }
    srcEl.addEventListener('pointermove', onMove);
    srcEl.addEventListener('pointerup', onUp);
    srcEl.addEventListener('pointercancel', onUp);
  }
  parts.forEach(function (p, i) { draw(i); });
  return {
    el: wrap,
    check: function () {
      locked = true;
      let n = 0; const details = [];
      parts.forEach(function (p) {
        const words = p.ans.map(function (a) { return a.w; }).join(' ');
        const options = [plain(p.q.s)].concat(p.q.alts || []).map(norm);
        const ok = options.indexOf(norm(words)) !== -1;
        if (ok) n++;
        p.card.classList.add(ok ? 'correct' : 'wrong', 'locked');
        p.note.textContent = ok ? '✅ Correct!' : '❌ The answer is: ' + plain(p.q.s);
        const endMark = p.q.s.slice(-1);
        const shown = words ? words.charAt(0).toUpperCase() + words.slice(1) + (/[.!?]/.test(endMark) ? endMark : '') : '';
        details.push({ key: p.q.s, q: 'Put in order: ' + p.initial.join(' / '), given: shown, correct: plain(p.q.s), ok: ok });
      });
      return { n: n, total: parts.length, details: details };
    }
  };
}

/* ============================ one lesson ============================ */
function mountLesson(panel, L, D) {
  const nav = el('nav', 'subnav'), tabs = el('div', 'tabs');
  tabs.setAttribute('role', 'tablist');
  nav.appendChild(tabs);
  const body = el('div', 'lesson-body');
  panel.appendChild(nav); panel.appendChild(body);

  const logs = { tf: MistakeLog(), def: MistakeLog(), gap: MistakeLog(), scr: MistakeLog() };
  const uis = {
    tf: tabChrome('Is the statement true or false according to the video? Choose an answer for each one, then check. The explanation appears after you check.', false),
    def: tabChrome('Read the definition and choose the matching word or phrase. Only one option is correct. The items come in short rounds, in a random order.', true),
    gap: tabChrome('Tap a phrase in the bank, then tap a gap to place it. Tap a filled gap to take the phrase back. The bank shows only the phrases for this round, and each one is already in the form you need.', true),
    scr: tabChrome('Put the phrases in the right order to build the sentence. <b>Drag</b> a phrase into the sentence (you can also drag to reorder), or just tap it. Tap or drag a phrase in the sentence to take it back.', true)
  };
  const tabsObj = {
    tf: TFTab(uis.tf, D.tf, logs.tf),
    def: RoundTab(uis.def, D.def, 7, buildDef, logs.def),
    gap: RoundTab(uis.gap, D.gap, 7, buildGap, logs.gap),
    scr: RoundTab(uis.scr, D.scr, 5, buildScr, logs.scr)
  };
  const labels = { tf: 'True / False', def: 'Definitions', gap: 'Gap fill', scr: 'Unscramble' };

  /* results tab */
  const res = el('section', 'ex');
  const resBox = el('div'); res.appendChild(resBox);

  function snaps() {
    return ['tf', 'def', 'gap', 'scr'].map(function (k) {
      const s = tabsObj[k].snapshot(); s.label = labels[k]; return s;
    });
  }
  function renderResults() {
    resBox.innerHTML = '';
    const s = snaps();
    let N = 0, T = 0;
    s.forEach(function (x) { N += x.n; T += x.total; });
    const card = el('div', 'card');
    s.forEach(function (x) {
      const row = el('div', 'sumrow');
      row.appendChild(el('span', 'l', x.label));
      row.appendChild(el('span', 'r', x.checked === 0 ? 'not checked yet' : (x.n + ' / ' + x.total + (x.rounds > 1 ? ' · ' + x.checked + ' of ' + x.rounds + ' rounds' : ''))));
      card.appendChild(row);
    });
    card.appendChild(el('div', 'sumtotal', 'Total so far: ' + N + ' / ' + T));
    resBox.appendChild(card);
    resBox.appendChild(el('p', 'intro', 'The saved file contains your answers, the correct answers and a list of your mistakes. Only the rounds you have checked are included.'));

    const field = el('div', 'field');
    const lab = el('label', '', 'Your name (it goes into the file)'); lab.setAttribute('for', 'name-' + L.id);
    const inp = el('input'); inp.type = 'text'; inp.id = 'name-' + L.id; inp.placeholder = 'e.g. Irina';
    inp.autocomplete = 'name'; inp.value = store.get('sp_name') || '';
    field.appendChild(lab); field.appendChild(inp); resBox.appendChild(field);

    const status = el('div', 'status'); status.setAttribute('role', 'status');
    const row = el('div', 'savebtns');
    const bHtml = el('button', 'primary', '💾 Save as HTML'); bHtml.type = 'button';
    const bPdf = el('button', 'ghost', '📄 Save as PDF'); bPdf.type = 'button';
    row.appendChild(bHtml); row.appendChild(bPdf); resBox.appendChild(row); resBox.appendChild(status);
    resBox.appendChild(el('p', 'hint', 'HTML: a file you can open later in any browser. PDF: your browser’s print window opens, choose “Save as PDF” (on iPhone: use the share icon, then “Save to Files”).'));
    resBox.appendChild(el('p', 'hint', 'If nothing downloads on your phone, open this page in Safari or Chrome instead of an in-app browser.'));

    function go(kind) {
      const now = snaps();
      if (!now.some(function (x) { return x.checked > 0; })) { status.textContent = 'Check at least one round first, then save.'; return; }
      const name = inp.value.trim();
      store.set('sp_name', name);
      if (kind === 'html') {
        downloadFile(fileBase(L, name) + '.html', reportHTML(L, name, now), 'text/html;charset=utf-8');
        status.textContent = 'Saved ✅ Check your downloads folder.';
      } else {
        status.textContent = 'Opening the print window…';
        printReport(L, name, now);
      }
    }
    bHtml.addEventListener('click', function () { go('html'); });
    bPdf.addEventListener('click', function () { go('pdf'); });
  }

  /* tab switching */
  const order = [['tf', '1 · True / False'], ['def', '2 · Definitions'], ['gap', '3 · Gap fill'], ['scr', '4 · Unscramble'], ['res', '5 · Save results']];
  const secs = { tf: uis.tf.sec, def: uis.def.sec, gap: uis.gap.sec, scr: uis.scr.sec, res: res };
  const btns = {};
  order.forEach(function (o) {
    const b = el('button', 'tab', o[1]); b.type = 'button'; b.setAttribute('role', 'tab');
    b.addEventListener('click', function () { select(o[0]); panel.scrollIntoView(); });
    tabs.appendChild(b); btns[o[0]] = b; body.appendChild(secs[o[0]]);
  });
  function select(k) {
    order.forEach(function (o) {
      btns[o[0]].setAttribute('aria-selected', o[0] === k ? 'true' : 'false');
      secs[o[0]].classList.toggle('active', o[0] === k);
    });
    const bb = btns[k];
    tabs.scrollLeft = bb.getBoundingClientRect().left - tabs.getBoundingClientRect().left + tabs.scrollLeft - (tabs.clientWidth - bb.offsetWidth) / 2;
    if (k === 'res') renderResults();
  }
  select('tf');
}

/* ============================ shell: lesson tabs + password gates ============================ */
const tabsEl = document.getElementById('ltabs'), panelsEl = document.getElementById('lessons');

function setLabel(L) { L.btn.textContent = (L.unlocked ? '🔓 ' : '🔒 ') + L.tab; }
function showGate(L, msg) {
  L.unlocked = false; setLabel(L);
  L.panel.innerHTML = '';
  const card = el('div', 'card gate');
  card.appendChild(el('h2', '', '🔒 ' + L.title));
  card.appendChild(el('p', 'intro', 'Enter the password to open this lesson.'));
  const form = el('form', 'gate-form');
  const input = el('input'); input.type = 'password'; input.name = 'lesson-key'; input.placeholder = 'Password';
  input.setAttribute('aria-label', 'Password for ' + L.title);
  input.setAttribute('autocapitalize', 'none'); input.setAttribute('autocorrect', 'off');
  input.setAttribute('spellcheck', 'false'); input.setAttribute('autocomplete', 'off');
  const showLab = el('label', 'show'); const cb = el('input'); cb.type = 'checkbox';
  cb.addEventListener('change', function () { input.type = cb.checked ? 'text' : 'password'; });
  showLab.appendChild(cb); showLab.appendChild(document.createTextNode('Show password'));
  const btn = el('button', 'primary', 'Unlock'); btn.type = 'submit';
  const err = el('div', 'err'); err.setAttribute('role', 'alert'); err.textContent = msg || '';
  form.appendChild(input); form.appendChild(showLab); form.appendChild(btn); form.appendChild(err);
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!input.value.trim()) { err.textContent = 'Please type the password.'; return; }
    btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
    try {
      const data = await decryptLesson(L, input.value);
      store.set('sp_pw_' + L.id, normPw(input.value));
      openLesson(L, data);
    } catch (ex) {
      btn.disabled = false; btn.textContent = 'Unlock';
      err.textContent = (ex && ex.code === 'nocrypto')
        ? 'This page must be opened from its web address (https) to unlock.'
        : 'That password isn’t right. Check the spelling (capital letters don’t matter).';
      input.select();
    }
  });
  card.appendChild(form);
  L.panel.appendChild(card);
}
function openLesson(L, data) {
  L.unlocked = true; setLabel(L);
  L.panel.innerHTML = '';
  const top = el('div', 'lesson-top');
  top.appendChild(el('h2', '', L.title));
  const lock = el('button', 'ghost small', '🔒 Lock'); lock.type = 'button';
  lock.title = 'Lock this lesson again on this device';
  lock.addEventListener('click', function () { store.del('sp_pw_' + L.id); showGate(L); });
  top.appendChild(lock);
  L.panel.appendChild(top);
  if (data && data.soon) {
    const c = el('div', 'card soon');
    c.appendChild(el('div', 'big', '🛠️'));
    c.appendChild(el('h3', '', 'Coming soon'));
    c.appendChild(el('p', 'intro', 'The practice for this lesson will appear here after the session.'));
    L.panel.appendChild(c);
    return;
  }
  mountLesson(L.panel, L, data);
}
async function tryStored(L) {
  if (L.autoTried) return;
  L.autoTried = true;
  const pw = store.get('sp_pw_' + L.id);
  if (!pw) return;
  try { openLesson(L, await decryptLesson(L, pw)); }
  catch (e) { store.del('sp_pw_' + L.id); }
}
function selectLesson(i, fromHash) {
  LESSONS.forEach(function (L, j) {
    L.btn.setAttribute('aria-selected', j === i ? 'true' : 'false');
    L.panel.classList.toggle('active', j === i);
  });
  if (!fromHash) { try { history.replaceState(null, '', '#' + LESSONS[i].id); } catch (e) { /* ignore */ } }
  tryStored(LESSONS[i]);
}
LESSONS.forEach(function (L, i) {
  L.btn = el('button', 'ltab'); L.btn.type = 'button'; L.btn.setAttribute('role', 'tab');
  L.btn.addEventListener('click', function () { selectLesson(i); });
  tabsEl.appendChild(L.btn);
  L.panel = el('section', 'lpanel'); L.panel.id = 'panel-' + L.id;
  panelsEl.appendChild(L.panel);
  showGate(L);
});
const startId = (location.hash || '').replace('#', '');
let startIdx = 0;
LESSONS.forEach(function (L, i) { if (L.id === startId) startIdx = i; });
selectLesson(startIdx, true);

})();
</script>
